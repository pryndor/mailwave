name: Team backend cron trigger

# Vercel's own Cron Jobs feature restricts free/Hobby plan schedules to once
# a day, which is useless for "anytime scheduling". This is a free
# alternative: a GitHub Actions scheduled workflow just pings the send-due
# endpoint every 5 minutes. GitHub doesn't guarantee exact timing under load,
# but for an indie team-tier product a few minutes of jitter is acceptable.
# If you upgrade the Vercel project to Pro later, its own crons.json trigger
# becomes redundant with this — disable one or the other, not both at once.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger send-due
        run: |
          curl -sf -X POST "${{ secrets.TEAM_BACKEND_URL }}/api/cron/send-due" \
            -H "Authorization: Bearer ${{ secrets.TEAM_CRON_SECRET }}"
