# Apache vhost for the webhook subdomain (Apache, certbot-managed TLS).
#
# Install: copy to /etc/apache2/sites-available/webhook.drugvigil.com.conf,
# then:
#   a2enmod proxy proxy_http
#   a2ensite webhook.drugvigil.com.conf
#   apachectl configtest && systemctl reload apache2
#   certbot --apache -d webhook.drugvigil.com
#
# certbot will auto-generate webhook.drugvigil.com-le-ssl.conf with the SSL
# vhost -- the ProxyPass/ProxyPassReverse lines below need to be copied into
# that generated file too (certbot only clones the <VirtualHost> block, it
# won't carry custom directives over automatically).

<VirtualHost *:80>
    ServerName webhook.drugvigil.com

    ProxyPreserveHost On
    ProxyPass        /api/razorpay-webhook http://127.0.0.1:8787/api/razorpay-webhook
    ProxyPassReverse /api/razorpay-webhook http://127.0.0.1:8787/api/razorpay-webhook

    ErrorLog  ${APACHE_LOG_DIR}/webhook.drugvigil.com-error.log
    CustomLog ${APACHE_LOG_DIR}/webhook.drugvigil.com-access.log combined
</VirtualHost>
